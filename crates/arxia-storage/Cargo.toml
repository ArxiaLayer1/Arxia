[package]
name = "arxia-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Storage abstraction for Arxia, with in-memory backends"
authors = []

[dependencies]
arxia-core = { path = "../arxia-core", default-features = false }
arxia-crypto = { path = "../arxia-crypto", default-features = false }

[features]
# std (default) is where the Mutex-backed ConcurrentMemoryStorage
# lives; a no_std build keeps the trait, MemoryStorage, transactions,
# the checksum envelope and the conformance checks.
default = ["std"]
std = ["arxia-core/std", "arxia-crypto/std"]
# Exposes the generic StorageBackend conformance checks so backend
# crates can hold their implementations to the same suite.
conformance = []

[dev-dependencies]
# The crate's own trait-contract tests exercise the conformance module
# too, which needs the feature on when this crate is the test subject.
arxia-storage = { path = ".", features = ["conformance"] }
