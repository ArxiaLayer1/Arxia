# cargo-deny policy for the Arxia workspace.
#
# LOW-014: reviewed and pinned. The settings below
# are the audit-acknowledged baseline ; changes require an
# explicit security-review commit citing this file.

[advisories]
# Reject any dependency with a known RUSTSEC vulnerability.
vulnerability = "deny"
# Warn (don't fail) on unmaintained dependencies. Promotion to
# "deny" is desirable once the alternative selection is settled.
unmaintained = "warn"

[licenses]
# All workspace dependencies must declare a license.
unlicensed = "deny"
# Permitted licenses (alphabetised):
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
]
# Reject GPL / LGPL / AGPL — Arxia is an Apache-2.0 / MIT
# dual-licensed project and cannot vendor copyleft code.
copyleft = "deny"

[bans]
# Warn on multiple versions of the same dep (common with
# transitive deps ; not always actionable but worth surfacing).
multiple-versions = "warn"
# Reject wildcard version requirements (e.g. `foo = "*"`) —
# they bypass MSRV / version-pinning hygiene.
wildcards = "deny"

# Per-crate accepted residual risks.
#
# Some transitive dependencies have known build-script or
# runtime quirks that we have explicitly reviewed and accepted
# rather than mitigated. Each entry below is paired with a
# rationale in `docs/dependency-risks.md` ; an upstream version
# bump that changes the dependency's behaviour beyond the
# accepted-risk envelope is forced through the version bound
# below, so the bump cannot land silently.

# zerocopy 0.8.x: build.rs forks rustc via PATH instead of
# using cargo's RUSTC env var. Hosts where the toolchain is
# not on PATH hit a "could not invoke rustc" build failure.
# Mitigation : README + GETTING_STARTED document the PATH
# requirement explicitly. See `docs/dependency-risks.md` §
# "zerocopy build-script PATH dependency" for the full
# rationale. The deny rules below pin us to the audited
# 0.8.x line — a 0.9 release forces a deliberate review.
[[bans.deny]]
name = "zerocopy"
version = "<0.8.0"

[[bans.deny]]
name = "zerocopy"
version = ">=0.9.0"

# redb : accepted-risk envelope is exactly the 4.1.x line. Two
# upstream crash windows around file growth exist in 4.1.0 and
# are fixed in the unreleased 4.2.0 ; see docs/dependency-risks.md
# "redb crash windows during file growth" for the rationale and
# the exit plan. A 4.2 release must come through deliberate
# review, not a silent bump.
[[bans.deny]]
name = "redb"
version = "<4.1.0"

[[bans.deny]]
name = "redb"
version = ">=4.2.0"

[sources]
# Reject unknown registries and unknown git remotes.
unknown-registry = "deny"
unknown-git = "deny"
# Only crates.io is permitted as an upstream source.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
